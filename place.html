<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Table</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background-color:#4CAF50;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        tr:hover{
            background:#ddd;
        }

        h2{
            text-align:center;
        }
    </style>
</head>
<body>

<h2>Posts Data</h2>

<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>name</th>
            <th>Username</th>
            
            
            <th>Email</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Website</th>

        </tr>
    </thead>

    <tbody id="tableBody">

    </tbody>
</table>

<script>

const users1 = async () => {

    try{

        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        const userData = await response.json();

        console.log(userData);

        let rows = "";

        userData.forEach(users => {

            rows += `
                <tr>
                    <td>${users.id}</td>
                    <td>${users.name}</td>
                    <td>${users.username}</td>
                
                    <td>${users.email}</td>
                    <td>${users.address.city}</td>
                    <td>${users.phone}</td>
                    <td>${users.website}</td>
                </tr>
                
            `;

        });


       
            

    
        document.getElementById("tableBody").innerHTML = rows;

    }
    catch(error){

        console.log(error);

    }

}

users1();


</script>

</body>
</html>
